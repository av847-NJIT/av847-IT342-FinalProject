<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Log in - BoxingBlog</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>

<body>
    <header class="site">
        <div class="wrap bar">
            <a class="logo" href="/index.html">BoxingBlog</a>
            <nav id="nav"></nav>
        </div>
    </header>
    <main class="wrap">
        <form class="panel" id="f" novalidate>
            <h1>Log in</h1>
            <div class="field"><label for="email">Email</label><input id="email" name="email" type="email" required
                    autocomplete="email"></div>
            <div class="field"><label for="password">Password</label><input id="password" name="password"
                    type="password" required minlength="8" autocomplete="current-password"></div>
            <button class="primary" type="submit">Log in</button>
            <p class="msg" id="msg" role="status"></p>
            <p class="alt">No account? <a href="/register.html">Register</a></p>
        </form>
    </main>
    <script src="/config.js"></script>
    <script src="/auth.js"></script>
    <script>
        const f = document.getElementById("f"), msg = document.getElementById("msg");
        f.addEventListener("submit", async (e) => {
            e.preventDefault();
            if (!f.reportValidity()) return;
            msg.textContent = "Signing in...";
            try {
                await BB_AUTH.login(f.email.value.trim(), f.password.value);
                location.href = "/search.html";
            } catch (err) { msg.textContent = err.message; }
        });
    </script>
</body>

</html>
