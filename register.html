<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Register - BoxingBlog</title>
    <link rel="stylesheet" href="/styles.css">
</head>

<body>
    <header class="site">
        <div class="wrap bar">
            <a class="logo" href="/index.html">BoxingBlog</a>
            <nav><a href="/login.html">Log in</a><a class="cta" href="/register.html">Register</a></nav>
        </div>
    </header>
    <main class="wrap">
        <form class="panel" id="f" novalidate>
            <h1>Create account</h1>
            <div class="field"><label for="username">Username</label><input id="username" name="username" type="text"
                    required minlength="3" maxlength="20" pattern="[A-Za-z0-9_]+"
                    title="Letters, numbers, and underscores only" autocomplete="username"></div>
            <div class="field"><label for="email">Email</label><input id="email" name="email" type="email" required
                    autocomplete="email"></div>
            <div class="field"><label for="password">Password</label><input id="password" name="password"
                    type="password" required minlength="8" autocomplete="new-password"></div>
            <div class="field"><label for="confirmPassword">Confirm password</label><input id="confirmPassword"
                    name="confirmPassword" type="password" required autocomplete="new-password"></div>
            <button class="primary" type="submit">Register</button>
            <p class="msg" id="msg" role="status"></p>
            <p class="alt">Have an account? <a href="/login.html">Log in</a></p>
        </form>
    </main>
    <script>
        const f = document.getElementById("f"), msg = document.getElementById("msg");
        const p = f.password, c = f.confirmPassword;
        function check() { c.setCustomValidity(c.value === p.value ? "" : "Passwords do not match.") }
        p.addEventListener("input", check); c.addEventListener("input", check);
        f.addEventListener("submit", e => {
            e.preventDefault(); check();
            if (!f.reportValidity()) return;
            msg.textContent = "Form is valid. Account creation connects to the API in Milestone 2.";
        });
    </script>
</body>

</html>
